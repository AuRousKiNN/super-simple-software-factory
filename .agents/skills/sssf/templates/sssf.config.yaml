# sssf.config.yaml — strict schema v2, backed only by Codex.
schema_version: 2

defaults:
  coding_agent: codex
  model: gpt-6-sol                 # exact Codex model id; availability is preflighted
  thinking: medium                 # none|minimal|low|medium|high|xhigh|max|ultra
  subagents:
    enabled: false                 # opt in only on planner/scout/decomposer; other roles stay single-threaded
    max_concurrent: 6
    role: sssf_recon
    config_file: .codex/agents/sssf_recon.toml
  # Off-limits to every agent that does not name them in its own `writes`.
  # Codex sandbox and these content-level write contracts are separate layers.
  # An agent must not edit the machinery that decides whether its own work passed.
  # The content contract is enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
    - adws/spec_artifacts_cli.py
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

codex:
  auth: cli                        # reuse the operator's Codex login; api_key is optional
  approval_policy: never           # no interactive elevation; sandbox remains enabled
  turn_timeout_s: 900
  startup_timeout_s: 30
  shutdown_grace_s: 10
  command_network_access: false

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

agents:
  - name: planner
    model: gpt-6-astra
    thinking: xhigh
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a grounded, self-contained plan with observable acceptance criteria.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    subagents:
      enabled: true
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/

  - name: decomposer
    model: gpt-6-astra
    thinking: high
    color: "#34d399"
    purpose: Decompose a complete spec into verifiable tickets with real dependencies.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/decomposer/system.md
      user: adws/adw_data/prompt_engineering/decomposer/user.md
    subagents:
      enabled: true
      max_concurrent: 6
      role: sssf_recon
      config_file: .codex/agents/sssf_recon.toml
    writes:
      - "specs/*/spec.tickets/**"

  - name: builder
    model: gpt-5.6-sol
    thinking: high
    color: "#22d3ee"
    purpose: Implement the bound spec or ticket and report the implementation outcome.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.

  - name: scout
    model: gpt-6-sol
    thinking: high
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    subagents:
      enabled: true
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    model: gpt-5.6-sol
    thinking: xhigh
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced

  - name: documenter
    model: gpt-6-sol
    thinking: medium
    color: "#e879f9"
    purpose: Explain execution evidence and update cumulative specification progress.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes: []                     # current invocation reports/ and handoff only
